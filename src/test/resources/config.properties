# Default framework configuration.
# Any key can be overridden from the command line, e.g. mvn test -Dbrowser=firefox -Dheadless=true

browser=chrome
headless=false
baseUrl=https://www.saucedemo.com/

# Explicit wait timeout in seconds
explicitWait=10

# Number of times a failed test is re-run before it is reported as failed
retryCount=1
