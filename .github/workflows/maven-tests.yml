name: Selenium Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1-5"   # nightly regression, Mon-Fri 02:30 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: "TestNG suite file to run"
        required: true
        default: "testng.xml"
        type: choice
        options:
          - testng.xml
          - testng-smoke.xml
      browser:
        description: "Browser"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Selenium tests
        run: >
          mvn --batch-mode --no-transfer-progress clean test
          -Dheadless=true
          -DsuiteXmlFile=${{ inputs.suite || 'testng.xml' }}
          -Dbrowser=${{ inputs.browser || 'chrome' }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            target/surefire-reports/
            target/extent-report/
            target/screenshots/
          retention-days: 14
          if-no-files-found: ignore
